<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Todo</title></head>
<body>
<h2>Tasks</h2>
<table border="1">
    <tr><th>ID</th><th>Title</th><th>Category</th><th>Completed</th><th>Actions</th></tr>
    <tr th:each="t : ${tasks}">
        <td th:text="${t.id}"></td>
        <td th:text="${t.title}"></td>
        <td th:text="${t.category != null ? t.category.name : '—'}"></td>
        <td th:text="${t.completed}"></td>
        <td>
            <form th:action="@{|/api/tasks/${t.id}/completed|}" method="post">
                <input type="hidden" name="_method" value="patch"/>
                <input type="hidden" name="value" th:value="${!t.completed}"/>
                <button type="submit" th:text="${t.completed ? 'Uncomplete' : 'Complete'}"></button>
            </form>
            <form th:action="@{|/api/tasks/${t.id}|}" method="post" onsubmit="return confirm('Delete?')">
                <input type="hidden" name="_method" value="delete"/>
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>

<h3>Create Task</h3>
<form action="/api/tasks" method="post">
    <input name="title" placeholder="title" required />
    <input name="detail" placeholder="detail" />
    <select name="categoryId">
        <option value="">--No Category--</option>
        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
    </select>
    <button type="submit">Add</button>
</form>

<script>
    // 让表单能“伪装” PATCH/DELETE：把 _method 转为真正动词（简易方案）
    document.querySelectorAll('form').forEach(f=>{
      if(f.querySelector('input[name="_method"]')){
        f.addEventListener('submit', e=>{
          e.preventDefault();
          const method=f.querySelector('input[name="_method"]').value.toUpperCase();
          const url=f.getAttribute('action');
          const data=new FormData(f);
          if(method==='PATCH'){
            fetch(url+'?'+new URLSearchParams(data).toString(),{method:'PATCH'}).then(()=>location.reload());
          }else if(method==='DELETE'){
            fetch(url,{method:'DELETE'}).then(()=>location.reload());
          }
        });
      }
    });
</script>
</body>
</html>

<!--说明：这里用原生表单 + 一点 JS，把 _method 转为 PATCH/DELETE 调接口。页面简单但能用；后续你可以换成更美观的组件或前端框架。-->
